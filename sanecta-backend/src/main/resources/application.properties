spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanecta}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sanecta}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sanecta}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.sql.init.platform=postgres
