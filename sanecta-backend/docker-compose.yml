services:
  postgres:
    image: postgres:16-alpine
    container_name: sanecta-postgres
    environment:
      POSTGRES_DB: sanecta
      POSTGRES_USER: sanecta
      POSTGRES_PASSWORD: sanecta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanecta -d sanecta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
